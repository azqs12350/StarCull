<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.17"/></feComponentTransfer>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D8A6"/>
      <stop offset="0.6" stop-color="#E0B478"/>
      <stop offset="1" stop-color="#C68C4E"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B07536"/>
      <stop offset="1" stop-color="#8E5724"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#sky)"/>
  <circle cx="450" cy="420" r="150" fill="#F6E9C9" opacity="0.92"/>
  <circle cx="450" cy="420" r="196" fill="none" stroke="#F6E9C9" stroke-width="1.5" opacity="0.55"/>
  <rect x="0" y="760" width="900" height="440" fill="url(#field)"/>
  <rect x="0" y="756" width="900" height="4" fill="#5B3516" opacity="0.5"/>
  <path d="M0 900h900M0 1010h900" stroke="#7A4A1E" stroke-width="1.5" opacity="0.35"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.5"/>
</svg>
