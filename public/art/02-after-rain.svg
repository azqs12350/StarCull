<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE3E2"/>
      <stop offset="1" stop-color="#C9D4D4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#sky)"/>
  <rect x="0" y="286" width="900" height="132" fill="#BCC9C9" opacity="0.7"/>
  <rect x="0" y="418" width="900" height="86" fill="#A5B5B6" opacity="0.75"/>
  <rect x="0" y="504" width="900" height="300" fill="#8E9FA2" opacity="0.8"/>
  <rect x="0" y="804" width="900" height="396" fill="#EDE9DE"/>
  <rect x="0" y="800" width="900" height="3" fill="#4B5354" opacity="0.55"/>
  <circle cx="662" cy="250" r="54" fill="#F2EFE6" opacity="0.85"/>
  <rect x="0" y="930" width="900" height="2" fill="#4B5354" opacity="0.18"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.5"/>
</svg>
